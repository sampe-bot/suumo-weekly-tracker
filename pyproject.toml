[project]
name = "suumo-weekly-tracker"
version = "0.1.0"
description = "Weekly SUUMO crawler for Sendai used condominiums with Google Sheets sync and Slack notifications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "google-auth>=2.35.0",
    "gspread>=6.1.4",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
]

[project.scripts]
suumo-tracker = "suumo_weekly_tracker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suumo_weekly_tracker"]
